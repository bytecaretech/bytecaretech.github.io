# Run with prek (`prek run --all-files`). Kept as YAML rather than prek.toml
# because Dependabot's pre-commit ecosystem only reads this file.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        name: Check JSON files
        exclude: ^\.vscode/
      - id: check-yaml
        name: Check YAML files
      - id: end-of-file-fixer
        name: Ensure proper file endings
      - id: trailing-whitespace
        name: Remove unnecessary whitespace from code
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        name: Check for large files
      - id: mixed-line-ending
        name: Check line endings

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
